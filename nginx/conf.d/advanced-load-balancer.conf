# ============================================================
# ADVANCED LOAD BALANCER CONFIG
# Demonstrates: weighted distribution, least_conn algorithm,
# health-check tuning, backup servers, and keepalive pooling.
#
# NOTE: least_conn and weight= are usually combined with each
# other OR used alone depending on your goal — this file shows
# both together for teaching purposes. In production, pick the
# strategy that matches your actual traffic pattern.
# ============================================================

upstream backend {
    # --- Load balancing algorithm ---
    # Default (no directive) = round robin: requests cycle
    # app1 -> app2 -> app3 -> app4 -> app1 ...
    #
    # least_conn = send the next request to whichever backend
    # currently has the fewest active connections. Better than
    # round robin when requests take variable time to process
    # (e.g. one backend is doing something slower per-request).
    least_conn;

    # --- Weighted distribution ---
    # weight=N (default is weight=1) biases how many requests
    # a server gets relative to others. Here app1 gets roughly
    # 3x the traffic of app2/app3/app4 combined proportionally.
    # Useful for: canary releases (send 10% of traffic to a new
    # version), or uneven hardware (a beefier server gets more).
    server app1:3000 weight=3;
    server app2:3000 weight=1;
    server app3:3000 weight=2;

    # --- Health check tuning ---
    # max_fails=N: how many failed attempts before nginx marks
    # this server "unavailable" temporarily.
    # fail_timeout=Ns: how long it stays marked unavailable
    # before nginx tries sending it traffic again.
    # Together: "if app4 fails 2 times in a row, stop sending
    # it traffic for 10 seconds, then retry."
    server app4:3000 weight=1 max_fails=2 fail_timeout=10s;

    # --- Backup server ---
    # backup: this server ONLY receives traffic if ALL of the
    # above servers are marked unavailable (via max_fails).
    # Useful for: a fallback/maintenance-page server, or a
    # spare instance you don't want under normal load.
    # (Reusing app1 here as a stand-in backup for demo purposes
    #  — in a real setup this would be a distinct server.)
    server app1:3000 backup;

    # --- Keepalive connection pool ---
    # Keeps a pool of idle connections open to backends instead
    # of opening a new TCP connection per request. Reduces
    # latency and CPU overhead under high traffic.
    # Note: requires proxy_http_version 1.1 and clearing the
    # Connection header below to actually take effect.
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://backend;

        # Required for keepalive above to actually work —
        # without these two lines, nginx falls back to
        # HTTP/1.0-style connections and reopens a new
        # connection per request regardless of keepalive being set.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- Timeouts (optional but good practice) ---
        # How long nginx waits for the backend to respond
        # before giving up and returning an error to the client.
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}