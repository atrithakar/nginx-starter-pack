upstream app1 {
    server app1:3000;
}
upstream app2 {
    server app2:3000;
}
upstream app3 {
    server app3:3000;
}
upstream app4 {
    server app4:3000;
}

server {
    listen 80;
    server_name localhost;

    location /app1/ {
        proxy_pass http://app1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /app2/ {
        proxy_pass http://app2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /app3/ {
        proxy_pass http://app3/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /app4/ {
        proxy_pass http://app4/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}