services:
  nginx:
    image: nginx:latest
    container_name: experiment-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/conf.d/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
    networks:
      - app-net

  app1:
    build: .
    environment:
      - SERVER_NO=1
    ports:
      - "3001:3000"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge