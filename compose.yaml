services:
  nginx:
    image: nginx:latest
    container_name: learn-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/conf.d/non-scaling.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVER_NO=1
    ports:
      - "3000"